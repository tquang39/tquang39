<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="110" fill="none">
  <defs>
    <!-- Manchester City Sky Blue & Gold Champion Trail Gradient -->
    <linearGradient id="cityTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d195b" stop-opacity="0" />
      <stop offset="35%" stop-color="#6cabdd" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#6cabdd" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffdf00" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing filter for trail and stars -->
    <filter id="cityGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Football pattern definition -->
    <radialGradient id="ballShading" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e1e8ed" />
      <stop offset="100%" stop-color="#6cabdd" />
    </radialGradient>
  </defs>

  <style>
    /* Twinkling Trophy / Sky Blue Stars */
    @keyframes twinkleStar {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .st1 { animation: twinkleStar 2.2s infinite ease-in-out; transform-origin: 90px 25px; }
    .st2 { animation: twinkleStar 3s infinite ease-in-out 0.7s; transform-origin: 280px 75px; }
    .st3 { animation: twinkleStar 2.5s infinite ease-in-out 1.2s; transform-origin: 470px 20px; }
    .st4 { animation: twinkleStar 3.2s infinite ease-in-out 0.4s; transform-origin: 680px 80px; }
    .st5 { animation: twinkleStar 2.7s infinite ease-in-out 1.8s; transform-origin: 840px 30px; }

    /* Bobbing / Dipping curve of the kick */
    @keyframes dippingCurve {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(8deg); }
    }
    .dipper {
      animation: dippingCurve 1.8s ease-in-out infinite;
    }
  </style>

  <!-- Stadium Night Sky Constellations & Champion Sparkles -->
  <g fill="#6cabdd">
    <circle cx="90" cy="25" r="1.8" class="st1" fill="#6cabdd" />
    <circle cx="280" cy="75" r="2.2" class="st2" fill="#ffdf00" />
    <circle cx="470" cy="20" r="1.6" class="st3" fill="#6cabdd" />
    <circle cx="680" cy="80" r="2.4" class="st4" fill="#3d195b" stroke="#6cabdd" stroke-width="0.5" />
    <circle cx="840" cy="30" r="1.7" class="st5" fill="#ffdf00" />

    <!-- 4-point golden champion sparkles -->
    <polygon points="170,30 172,34 176,35 172,36 170,40 168,36 164,35 168,34" fill="#ffdf00" opacity="0.75" class="st2" />
    <polygon points="560,70 562,73 565,74 562,75 560,78 558,75 555,74 558,73" fill="#6cabdd" opacity="0.85" class="st4" />
    <polygon points="780,25 782,28 785,29 782,30 780,33 778,30 775,29 778,28" fill="#ffdf00" opacity="0.7" class="st1" />
  </g>

  <!-- Flight Group crossing the entire screen -->
  <g id="football-flight">
    <!-- Smooth Curving Cross / Long-ball Trajectory (De Bruyne style curl) -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="-100 55; 160 20; 370 65; 580 18; 770 55; 980 25"
      keyTimes="0; 0.22; 0.45; 0.68; 0.86; 1"
      dur="11s"
      repeatCount="indefinite"
    />

    <g class="dipper">
      <!-- Curved Energy Trail / Comet Tail in Sky Blue & Gold -->
      <path d="M-60,18 C-40,25 -20,15 0,20" stroke="url(#cityTrail)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#cityGlow)" />
      <path d="M-45,20 C-30,23 -15,18 0,20" stroke="#6cabdd" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />

      <!-- Sparkles trailing behind ball -->
      <circle cx="-25" cy="16" r="2.2" fill="#ffdf00" opacity="0.9">
        <animate attributeName="r" values="2.2;0.5;2.2" dur="0.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="-40" cy="24" r="1.8" fill="#6cabdd" opacity="0.7">
        <animate attributeName="r" values="1.8;0.4;1.8" dur="0.9s" repeatCount="indefinite" />
      </circle>
      <circle cx="-55" cy="18" r="1.3" fill="#ffffff" opacity="0.6" />

      <!-- Rotating Football (Soccer Ball) -->
      <g transform="translate(18, 18)">
        <!-- Continuous Fast Spin -->
        <g>
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 0 0"
            to="360 0 0"
            dur="1.2s"
            repeatCount="indefinite"
          />

          <!-- Base Ball Sphere with Sky Blue Lighting -->
          <circle cx="0" cy="0" r="15" fill="url(#ballShading)" stroke="#1c2c40" stroke-width="1.2" />

          <!-- Classic Football Pentagons & Seams in Navy & Sky Blue -->
          <!-- Center Pentagon -->
          <polygon points="0,-4 3.8,-1.2 2.3,3.2 -2.3,3.2 -3.8,-1.2" fill="#1c2c40" />

          <!-- Seam lines radiating out -->
          <line x1="0" y1="-4" x2="0" y2="-9" stroke="#1c2c40" stroke-width="1.1" />
          <line x1="3.8" y1="-1.2" x2="8" y2="-3" stroke="#1c2c40" stroke-width="1.1" />
          <line x1="2.3" y1="3.2" x2="6" y2="7" stroke="#1c2c40" stroke-width="1.1" />
          <line x1="-2.3" y1="3.2" x2="-6" y2="7" stroke="#1c2c40" stroke-width="1.1" />
          <line x1="-3.8" y1="-1.2" x2="-8" y2="-3" stroke="#1c2c40" stroke-width="1.1" />

          <!-- Outer Partial Pentagons -->
          <polygon points="0,-9 -4,-13 4,-13" fill="#6cabdd" />
          <polygon points="8,-3 13,-6 14,-1" fill="#1c2c40" />
          <polygon points="6,7 11,9 8,13" fill="#6cabdd" />
          <polygon points="-6,7 -8,13 -11,9" fill="#1c2c40" />
          <polygon points="-8,-3 -14,-1 -13,-6" fill="#6cabdd" />
        </g>

        <!-- Golden Champion Crown / Aura floating just above the ball -->
        <path d="M-6,-17 L-3,-13 L0,-18 L3,-13 L6,-17 L4,-11 L-4,-11 Z" fill="#ffdf00" stroke="#b8860b" stroke-width="0.5" filter="url(#cityGlow)">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite" />
        </path>
      </g>
    </g>
  </g>
</svg>
